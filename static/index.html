<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grisz exam</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 24px auto; padding: 0 16px; line-height: 1.5; }
  label { display: block; margin-top: 8px; font-weight: 600; }
  input, button { font: inherit; padding: 6px 10px; }
  input[type=text] { width: 100%; box-sizing: border-box; }
  button { margin-top: 10px; cursor: pointer; }
  fieldset { margin: 12px 0; border-radius: 6px; }
  fieldset label { display: block; font-weight: normal; margin: 4px 0; }
  .right { color: #156b3a; } .wrong { color: #a12a21; }
  .msg { font-weight: 600; }
</style>
</head>
<body>
<h1>Grisz exam</h1>

<form id="start-form">
  <label for="name">Your name</label>
  <input id="name" type="text" required maxlength="60">
  <label for="code">Exam code (from your teacher)</label>
  <input id="code" type="text" required maxlength="12" autocomplete="off" style="text-transform: uppercase">
  <small>Your name, answers and score are saved so your teacher can grade them. Ask your teacher to delete them anytime.</small><br>
  <button>Start exam</button>
  <p id="start-msg" class="msg"></p>
</form>

<div id="exam"></div>

<script>
const $ = (id) => document.getElementById(id);
const el = (tag, text, parent) => {
  const e = document.createElement(tag);
  if (text) e.textContent = text;  // textContent, never innerHTML: exam text comes from the AI
  if (parent) parent.appendChild(e);
  return e;
};

async function call(url, opts) {
  const r = await fetch(url, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof data.detail === "string" ? data.detail : `${r.status} ${r.statusText}`);
  return data;
}

$("start-form").onsubmit = async (e) => {
  e.preventDefault();
  $("start-msg").textContent = "Loading…";
  const code = $("code").value.trim().toUpperCase();
  try {
    const exam = await call("/exam/" + encodeURIComponent(code));
    $("start-form").hidden = true;
    showExam(code, exam);
  } catch (err) { $("start-msg").textContent = err.message; }
};

function showExam(code, exam) {
  const box = $("exam");
  el("h2", exam.title, box);
  el("p", `${$("name").value} · ${exam.questions.length} questions`, box);
  const answers = [], results = [];
  let section = null;
  exam.questions.forEach((q, i) => {
    if (q.type !== section) { section = q.type; el("h3", exam.sections[q.type], box); }
    const f = el("fieldset", "", box);
    el("legend", `${i + 1}. ${q.q}`, f);
    const options = q.type === "mc" ? q.choices : q.type === "tf" ? ["True", "False"] : null;
    if (options) {
      options.forEach((c) => {
        const lab = el("label", "", f);
        const r = el("input", "", lab);
        r.type = "radio"; r.name = "q" + i; r.value = c;
        lab.append(" " + c);
      });
      answers.push(() => (f.querySelector("input:checked") || {}).value || "");
    } else {
      const t = el("input", "", f);
      t.type = "text"; t.setAttribute("aria-label", `Answer to question ${i + 1}`);
      answers.push(() => t.value);
    }
    results.push(el("p", "", f));
  });
  const msg = el("p", "", box);
  msg.className = "msg";
  const btn = el("button", "Hand in", box);
  let warned = false;
  btn.onclick = async () => {
    const given = answers.map((a) => a());
    const blank = given.filter((a) => !a.trim()).length;
    if (blank && !warned) { warned = true; msg.textContent = `You left ${blank} blank. Click "Hand in" again to hand in anyway.`; return; }
    btn.disabled = true;
    msg.textContent = "Grading…";
    try {
      const g = await call(`/exam/${encodeURIComponent(code)}/submit`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ student: $("name").value, answers: given }) });
      box.querySelectorAll("input").forEach((x) => { x.disabled = true; });
      g.results.forEach((r, i) => {
        results[i].className = r.right ? "right" : "wrong";
        results[i].textContent = r.right
          ? `✓ Right. ${r.why} (${r.page})`
          : `✗ The answer is: ${r.answer}. ${r.wrong} ${r.why} (${r.page})`;
      });
      msg.textContent = `Score: ${g.score} / ${g.total}. Saved for your teacher.`;
      btn.remove();
      box.prepend(msg.cloneNode(true));
    } catch (err) { msg.textContent = err.message; btn.disabled = false; }
  };
}
</script>
</body>
</html>
