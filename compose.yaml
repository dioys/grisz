services:
  api:
    build: .
    image: grisz
    ports: ["127.0.0.1:8000:8000"]  # only your PC can reach it
    env_file: .env                   # your key stays on your PC, never inside the image
    environment: &env
      CHROMA_HOST: chroma            # use the shared Chroma server, not files
      DB_PATH: /app/db/grisz.db       # exams and results
      REDIS_URL: redis://redis:6379/0
    volumes: &files
      - ./data:/app/data             # your PDFs
      - ./storage:/app/storage       # embedding model
      - db:/app/db                   # exams and results (a Docker volume: safe for two containers at once)
    depends_on: [redis, chroma]

  worker:                            # reads uploaded PDFs and writes exams in the background
    build: .
    image: grisz
    command: celery -A worker.tasks worker --loglevel=info --concurrency=1
    env_file: .env
    environment: *env
    volumes: *files
    depends_on: [redis, chroma, api]

  redis:                             # job queue between api and worker
    image: redis:8.2-alpine

  chroma:                            # the index, shared by api and worker
    image: chromadb/chroma:1.5.9
    volumes:
      - ./storage/chroma-server:/data

  prometheus:                        # collects Grisz's /metrics every 15 s
    image: prom/prometheus:v3.5.0
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on: [api]

  grafana:                           # dashboards at http://127.0.0.1:3000
    image: grafana/grafana:12.1.0
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"   # open the dashboard without logging in (your PC only)
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./ops/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./ops/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./ops/grafana/grisz.json:/etc/grafana/provisioning/dashboards/grisz.json:ro
    depends_on: [prometheus]

volumes:
  db:
