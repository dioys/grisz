# Production additions. Run on the server: docker compose -f compose.yaml -f compose.prod.yaml up -d --build
# Only Caddy (ports 80/443) faces the internet. The API, Grafana and Prometheus stay on 127.0.0.1 of the server.
services:
  caddy:
    image: caddy:2.10-alpine
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./storage/caddy:/data               # HTTPS certificates
    depends_on: [api]
    restart: unless-stopped

  api:
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    restart: unless-stopped                 # --proxy-headers: rate limits see the visitor's IP, not Caddy's
  worker:
    restart: unless-stopped
  redis:
    restart: unless-stopped
  chroma:
    restart: unless-stopped
  prometheus:
    restart: unless-stopped
  grafana:
    restart: unless-stopped
